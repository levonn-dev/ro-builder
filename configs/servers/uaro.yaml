# Source: https://wiki.uaro.net/Old_Glast_Heim/; entry / monster IDs only.
#
# UARO ported the renewal "Old Glast Heim" (OGH) instance to pre-renewal
# as an open-world map (no instance cooldown). Entry: NPC Hugin in
# Glast Heim at /navi glast_01 204/273. Required level: 99. The wiki
# documents which monsters spawn but does NOT publish UARO's adapted
# combat stats; only the iRO mob IDs.
#
# The HP/Atk/Def/MDef/Race/Element/Size below are sourced verbatim from
# the rAthena renewal mob_db (db/re/mob_db.yml). UARO almost certainly
# scaled these for pre-renewal balance; these are the BEST AVAILABLE
# starting values, not authoritative. Refine with UARO-provided numbers
# (Discord, in-game observations, future wiki publication) when known.
#
# Atk convention: rAthena renewal's `Attack` and `Attack2` fields don't
# follow the pre-renewal `[min, max]` convention; for boss-style mobs
# Attack > Attack2 (physical vs magical, possibly). Below uses
# atk_min = min(Attack, Attack2), atk_max = max(...) so the pre-re calc
# treats them as a damage range.
custom_mobs:
  # Floor 1 + Floor 2 trash mobs
