quality_gates:
  # Tiered HIT% gates. Fractions match combat.hit (0.95 = 95%).
  # Below 80% half your swings whiff; below 95% the farming economy
  # breaks; below 100% scales arrow/SP cost per kill (every guide
  # implicitly aims for 100% on the active farm target).
  hit:
    normal_fail_hard: 0.80
    normal_fail: 0.95
    normal_warn: 1.00
    mvp_fail_hard: 0.85
    mvp_fail: 0.95

  # FLEE gate fires only when the build's mitigation is dodge-driven
  # (calc shows aveWithDodge << ave). Pre-re cap is 95%; -20% in WoE.
  flee:
    fail: 0.90
    warn: 0.95
    woe_penalty: 0.20

  # EHP multiplier: maxHp must absorb at least this many copies of the
  # target's biggest single hit. 2× for normal MVP melee, 2.5× for
  # magic-burst content (Storm Gust / Meteor Storm / Magnus Exorcismus
  # tier).
  ehp_multiplier:
    normal: 1.5
    mvp_melee: 2.0
    mvp_magic_burst: 2.5

  ttk_mvp_max_sec: 300       # beyond 5 minutes MVP regen / status timers undermine the kill
  cast_time_warn_ms: 3000    # primary skill effective cast > 3s -> slowness warn
  cast_interrupt_ms: 2000    # interruptible primary effective cast > 2s + no cast-safety -> interruption gate

  # Per-scenario-type status_immunity priority. fail = build must clear
  # immunity (gate emits fail severity if uncovered); warn = LLM should
  # know but build can ship; statuses outside both lists are skipped
  # entirely. WoE folds into pvp.
  #
  # PvM/MVP rationale: frozen and stun shut down farming entirely
  # (frozen = SG/Frost mobs lock you, stun = Khalitzburg/Bongun-tier
  # interrupt cycles). Sleep doesn't matter for PvM/MVP; most
  # sleep-applying mobs hit you to wake you. Stone curse, curse,
  # silence are real but recoverable.
  #
  # PvP/WoE rationale: sleep promotes to fail because PvP players
  # don't auto-attack you out of sleep. Blind and poison promote to
  # warn (precast + ranged dmg matters more in WoE; getting blinded
  # by a Sniper is a real loss).
  status_priority:
    pvm:
      fail: [ frozen, stun ]
      warn: [ stone_curse, curse, silence ]
    pvp:
      fail: [ frozen, stun, sleep ]
      warn: [ stone_curse, curse, blind, silence, poison ]

