name: ci

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same PR/branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install golangci-lint
        # `go install` builds from source with the just-installed Go toolchain,
        # so the linter binary matches the project's targeted Go version.
        # Avoids the build-Go vs target-Go mismatch prebuilt binaries hit.
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - run: task fmt:check:go
      - run: task lint:go
      - run: task build
      - run: task test:go

  sidecar-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: calc-sidecar/package-lock.json

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: task bootstrap:node
      - run: task fmt:check:ts
      - run: task lint:ts
      - run: task test:sidecar:shim:stub
      - run: task test:sidecar:backend:stub

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: task tilt:lint

  e2e:
    runs-on: ubuntu-latest
    env:
      CALC_BACKEND: stub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: calc-sidecar/package-lock.json

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: task bootstrap:node
      - run: task build
      - run: task e2e

  docker-e2e:
    runs-on: ubuntu-latest
    env:
      CALC_BACKEND: stub
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: task docker:e2e
