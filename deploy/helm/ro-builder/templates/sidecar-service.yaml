apiVersion: v1
kind: Service
metadata:
  name: {{ include "ro-builder.sidecarName" . }}
  labels:
    {{- include "ro-builder.labels" (dict "component" "sidecar" "root" .) | nindent 4 }}
spec:
  # ClusterIP; sidecar is internal-only. The api reaches it via the
  # SIDECAR_URL env (set in the ConfigMap to this service's DNS name).
  type: ClusterIP
  ports:
    - name: http
      port: 7401
      targetPort: http
      protocol: TCP
  selector:
    {{- include "ro-builder.selectorLabels" (dict "component" "sidecar" "root" .) | nindent 4 }}
