    attack_skill: { name: venom_splasher }
  - aegis_name: AS_POISONREACT          # Poison React, id 139, max 10
    attack_skill: { name: poison_react }
  - aegis_name: ASC_BREAKER             # Soul Breaker (Soul Destroyer), id 379, max 10
