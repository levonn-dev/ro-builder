# Hand-authored attack-skill metadata. Merged onto skill records (by aegis_name)
# at catalog build time by cmd/build-catalog. Co-located with the skill it
# describes. Semantic only: NO calc-engine ids (the sidecar binding maps
# name -> engine controls). Marks a skill as scoreable for per-skill damage.
#
# name: lowercase_snake semantic key, unique across entries. Uses the common
# pre-renewal skill name, which can differ from the catalog's display name
# (e.g. soul_breaker / "Soul Destroyer").
#
# A row applies to EVERY class whose skill tree contains its aegis_name, so each
# skill is listed exactly once and inheritance is implicit. Sections mirror the
# job tree: first-class skills sit in their own sections, and each second /
# transcendent / expanded section lists only that job's OWN skills plus a
# "(+ Parent)" pointer to the first-class section it also inherits. So a Knight
# scores the Knight section AND the Swordman section; a Bard the Bard section
# AND the Archer section. (Super Novice inherits every first-class section.)
skills:
  # ===== First classes =====

  # Swordman
  - aegis_name: SM_BASH                 # Bash, max 10
    attack_skill: { name: bash }
  - aegis_name: SM_MAGNUM               # Magnum Break, max 10
    attack_skill: { name: magnum_break }

  # Mage. Magic damage scales off MATK.
