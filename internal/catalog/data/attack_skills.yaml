  # Soul Linker. Unlike Star Gladiator, the Taekwon kicks do NOT carry over (only
  # the utility TK skills do, none of which deal damage), so esma / estin / estun
  # are its only scoreable skills. Esma is the main MATK-scaled bolt nuke,
  # castable only right after a Spirit Link or an Estin / Estun / Eske cast. Estin
  # and Estun are weak bolts gated by target size.
  - aegis_name: SL_SMA                  # Esma, max 10
    attack_skill: { name: esma }
  - aegis_name: SL_STIN                 # Estin, max 7
    # Meaningful damage only against Small-size targets.
    attack_skill: { name: estin }
  - aegis_name: SL_STUN                 # Estun, max 7
    # Meaningful damage only against Large-size targets.
    attack_skill: { name: estun }

  # Star Gladiator (+ Taekwon kicks). Warmth of the Sun / Moon / Stars is a fast-
  # ticking Heat damage-over-time: only active while standing on a designated
  # Sun / Moon / Star map. Per-hit damage approximates auto-attack but the hit
  # interval is far shorter, so DPS / time-to-kill carry it. All three are the
  # same skill on different map types.
  - aegis_name: SG_SUN_WARM             # Warmth of the Sun, max 3
    attack_skill: { name: sun_warmth }
  - aegis_name: SG_MOON_WARM            # Warmth of the Moon, max 3
    attack_skill: { name: moon_warmth }
  - aegis_name: SG_STAR_WARM            # Warmth of the Stars, max 3
    attack_skill: { name: star_warmth }
