# Hand-authored self-buff metadata. Merged onto skill records (by aegis_name)
# at catalog build time by cmd/build-catalog. Co-located with the skill the
# buff comes from. Semantic only: no rocalc ids (the sidecar binding maps
# name -> engine controls). See docs/superpowers/specs/2026-06-01-rocalc-self-buffs-design.md.
#
# kind: weapon_endow | stat_buff | status   (data.AllBuffKinds)
# persistence: permanent | transient        (data.AllPersistence)
# endow.elements: ordered; index (1-based) == required buff level. Element
#   names from data.AllElements.
skills:
  - aegis_name: TK_SEVENWIND          # Mild Wind, id 425, max 7
    self_buff:
      name: mild_wind
      kind: weapon_endow
      persistence: transient
      endow:
        # This list is the SOURCE OF TRUTH for Mild Wind's element unlock order.
        # Index (1-based) == required skill level: earth=1, wind=2, ..., holy=7.
        # The calc sidecar's MILD_WIND_ORDER const in
        # calc-sidecar/src/backends/rocalc/index.ts mirrors this order
        # (defense-in-depth; the sidecar cannot read the catalog).
        # Keep the two in sync: any reorder here must be reflected there,
        # and TestMildWindOrder in internal/catalog/buffs_test.go pins this list.
        elements: [earth, wind, water, fire, ghost, shadow, holy]
  - aegis_name: TK_RUN                 # Sprint, id 411 (Spurt status: +STR/ATK, 150s)
    self_buff:
      name: spurt
      kind: stat_buff
      persistence: transient
  - aegis_name: TK_MISSION             # Taekwon Mission, id 493 -- ranker anchor
    self_buff:
      name: taekwon_ranker
      kind: status
      persistence: permanent

  # --- High Priest (and inherited Acolyte/Priest) self-buffs ---
  # Player support buffs -> sidecar support_slot driver (A2_Skill* bank).
  - aegis_name: AL_BLESSING            # Blessing, id 34, max 10
    self_buff: { name: blessing, kind: stat_buff, persistence: transient }
  - aegis_name: AL_INCAGI              # Increase AGI, id 29, max 10
    self_buff: { name: increase_agi, kind: stat_buff, persistence: transient }
  - aegis_name: PR_IMPOSITIO           # Impositio Manus, id 66, max 5
    self_buff: { name: impositio_manus, kind: stat_buff, persistence: transient }
  - aegis_name: PR_GLORIA              # Gloria, id 75, max 5
    self_buff: { name: gloria, kind: stat_buff, persistence: transient }
  - aegis_name: AL_ANGELUS             # Angelus, id 33, max 10
    self_buff: { name: angelus, kind: stat_buff, persistence: transient }
  - aegis_name: HP_ASSUMPTIO           # Assumptio, id 361, max 5 (High Priest)
    self_buff: { name: assumptio, kind: status, persistence: transient }
  - aegis_name: PR_SUFFRAGIUM          # Suffragium, id 67, max 3 (cast-time; applied but not yet scored)
    self_buff: { name: suffragium, kind: stat_buff, persistence: transient }
  # Holy weapon endow -> existing weapon_endow driver (A_Weapon_element). Holy only.
  - aegis_name: PR_ASPERSIO            # Aspersio, max 5
    self_buff:
      name: aspersio
      kind: weapon_endow
      persistence: transient
      endow:
        elements: [holy]
  # Player-cast enemy debuffs -> sidecar enemy_debuf driver (B_debuf* bank).
  - aegis_name: PR_LEXAETERNA          # Lex Aeterna, id (Gravity) max 1; B_debuf6 checkbox; e*=2
    self_buff: { name: lex_aeterna, kind: debuff, persistence: transient }
  - aegis_name: AL_DECAGI              # Decrease AGI, max 10; B_debuf11 select; enemy flee/aspd down
    self_buff: { name: decrease_agi, kind: debuff, persistence: transient }
  - aegis_name: AL_CRUCIS              # Signum Crucis, max 10; B_debuf12 select; enemy DEF down (undead/demon only)
    self_buff: { name: signum_crucis, kind: debuff, persistence: transient }
