  # --- Ninja self-buffs ---
  # 14th class. Ninja is an Expanded class -- no rebirth (no trans-gating) and no
  # shared tree (no inherited buffs), so ClassBuffs[ninja] is exactly these 3.
  # Excluded: ALL_INCCARRY weight (see the Ninja block in index.ts). Only
  # ninja_aura is scored (raises STR/INT -> ATK/MATK -> damage.ave);
  # ninja_mastery (SP recovery) and throwing_mastery (throw-skill damage) move no
  # field the auto-attack sim reads, so they are wired-but-inert per the
  # bind-every-control directive. Cicada Skin Shed / Mirror Image are not
  # modeled, so they have no control surface and are ignored.
  - aegis_name: NJ_NEN                  # Ninja Aura ("Soul"), max 5; +STR/INT -> +damage (readCombatResults().damage.ave)
    self_buff: { name: ninja_aura, kind: stat_buff, persistence: transient }
  - aegis_name: NJ_NINPOU               # Ninja Mastery ("Spirit of the Blade" / Ninpou Training), max 10; SP recovery only -- wired-but-inert
    self_buff: { name: ninja_mastery, kind: status, persistence: permanent }
  - aegis_name: NJ_TOBIDOUGU            # Throwing Mastery ("Shuriken Training"), max 10; throw-skill damage only -- wired-but-inert
    self_buff: { name: throwing_mastery, kind: status, persistence: permanent }

  # --- Alchemist / Creator self-buffs ---
  # 15th class (alchemist / creator sets are identical -> no trans gating, like
  # Champion=Monk). Only Axe Mastery is new here; crazy_uproar (MC_LOUD) already
  # gates in via the Merchant tree (see the Whitesmith block) and needs no row --
  # the catalog test asserts it. Excluded: Enlarge Weight Limit R (universal
  # carry-weight) and Enlarge Weight Limit / MC_INCCARRY (Merchant carry-weight --
  # also excluded in Whitesmith's set). Axe Mastery is axe-gated in the calc
  # (+ATK with axes only; non-axe weapons see no change) and the bonus is
  # combat-sim mastery ATK -- it moves readCombatResults().damage.ave, not
  # derived atk.base, like Sword Mastery.
  - aegis_name: AM_AXEMASTERY           # Axe Mastery, max 10; +ATK with axes (readCombatResults().damage.ave, axe-only)
    self_buff: { name: axe_mastery, kind: stat_buff, persistence: permanent }

  # --- Soul Linker self-buffs ---
  # 16th class. Expanded class on the TaeKwon branch; it inherits mild_wind/spurt
  # (already mapped). Kaina (SL_KAINA) is the one SL-specific buff and the only
  # one scored: it raises maxSp (readDerivedStats().maxSp / Go Derived.MaxSP),
  # +30/level, a sustain/defense-side stat_buff like Paladin faith->maxHp. The 4
  # TaeKwon skills below (Tumbling/Peaceful Break/Happy Break/Kihop) are SHARED
  # across the TaeKwon branch, so these rows also surface for TaeKwon Kid and Star
  # Gladiator (count-locks 7 and 16). All 4 are inert across the scored field set
